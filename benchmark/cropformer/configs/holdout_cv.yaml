model:
  hidden_size: 64
  num_attention_heads: 4
  kernel_size: 3
  hidden_dropout: 0.5
  attention_dropout: 0.5
training:
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 32
  grad_clip: 1.0
  max_epochs: 100
  patience: 40
hpo:
  enabled: true
  method: bayesian
  n_trials: 200
  metric: pearson
  direction: maximize
  seed: 42
  parameters:
    model.hidden_size:
      type: categorical
      choices: [64, 128]
    model.num_attention_heads:
      type: categorical
      choices: [4, 8]
    model.kernel_size:
      type: categorical
      choices: [3, 5]
    model.hidden_dropout:
      type: float
      low: 0.1
      high: 0.5
      step: 0.05
    model.attention_dropout:
      type: float
      low: 0.1
      high: 0.5
      step: 0.05
    training.learning_rate:
      type: log_uniform
      low: 1.0e-4
      high: 3.0e-3
  grid:
    model.hidden_size: [64, 128]
    model.num_attention_heads: [4, 8]
    model.kernel_size: [3, 5]
    model.hidden_dropout: [0.2, 0.3, 0.4, 0.5]
    model.attention_dropout: [0.2, 0.3, 0.4, 0.5]
    training.learning_rate: [0.0003, 0.001]
output:
  directory: cropformer_nested_cv
