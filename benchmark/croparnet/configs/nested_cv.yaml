model:
  weights_units: [64, 32]
  regressor_units: [64, 32]
  dropout: 0.3
  attention_dropout: 0.1
training:
  learning_rate: 0.001
  weight_decay: 0.1
  batch_size: 64
  grad_clip: 1.0
  max_epochs: 120
  patience: 40
hpo:
  enabled: true
  method: bayesian
  n_trials: 200
  metric: pearson
  direction: maximize
  seed: 42
  parameters:
    model.weights_units:
      type: categorical
      choices:
        - [64, 32]
        - [128, 64]
    model.regressor_units:
      type: categorical
      choices:
        - [64, 32]
        - [128, 64]
    model.dropout:
      type: float
      low: 0.1
      high: 0.4
      step: 0.05
    model.attention_dropout:
      type: float
      low: 0.1
      high: 0.4
      step: 0.05
    training.learning_rate:
      type: log_uniform
      low: 1.0e-4
      high: 3.0e-3
    training.weight_decay:
      type: log_uniform
      low: 1.0e-4
      high: 1.0e-1
  grid:
    model.weights_units:
      - [64, 32]
      - [128, 64]
    model.regressor_units:
      - [64, 32]
      - [128, 64]
    model.dropout: [0.1, 0.2, 0.3]
    model.attention_dropout: [0.1, 0.2, 0.3]
    training.learning_rate: [0.0003, 0.001]
output:
  directory: croparnet_nested_cv
