# Compatibility configuration for DEM-SNP.

benchmark:
  model_name: DEM-SNP
  mode: dem-snp

data:
  modalities: [snp]
  rf_enabled: true
  selected_markers:
    snp: 1000
  rf_estimators: 500
  rf_random_states: [45, 46, 47]
  rf_n_jobs: -1
  min_observed: 2

model:
  n_heads: 1
  n_encoders: 1
  hidden_dim: 256
  dropout: 0.2
  single_hidden: [512, 128]
  conc_hidden: [1536, 512]
  integrated_hidden: [1024, 256, 128]

train:
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 32
  max_epochs: 200
  patience: 40
  min_delta: 0.0001

hpo:
  enabled: true
  method: bayesian
  n_trials: 200
  metric: avg_pearson
  direction: maximize
  seed: 42
  parameters:
    model.dropout:
      type: float
      low: 0.05
      high: 0.4
      step: 0.05
    model.hidden_dim:
      type: categorical
      choices: [128, 256, 512]
    model.n_encoders:
      type: categorical
      choices: [1, 2]
    model.n_heads:
      type: categorical
      choices: [1, 2]
    train.learning_rate:
      type: log_uniform
      low: 1.0e-4
      high: 3.0e-3
    train.weight_decay:
      type: log_uniform
      low: 1.0e-6
      high: 1.0e-3
