# DEM-SNP single-trait nested-CV benchmark configuration.

benchmark:
  model_name: DEM-SNP
  mode: dem-snp

data:
  modalities: [snp]
  rf_enabled: false
  selected_markers:
    snp: 1000
  rf_estimators: 500
  rf_random_states: [45, 46, 47]
  rf_n_jobs: -1
  min_observed: 2

model:
  n_heads: 1
  n_encoders: 1
  hidden_dim: 256
  dropout: 0.2
  single_hidden: [512, 128]
  conc_hidden: [1536, 512]
  integrated_hidden: [1024, 256, 128]

train:
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 32
  max_epochs: 200
  patience: 40
  min_delta: 0.0001

hpo:
  method: grid_search
  metric: avg_pearson
  direction: maximize
  parameters:
    model.dropout:
      values: [0.1, 0.2]
    model.hidden_dim:
      values: [256, 512]
    model.n_encoders:
      values: [1, 2]
    model.n_heads:
      values: [1, 2]
    train.learning_rate:
      values: [0.001, 0.0001]
    train.weight_decay:
      values: [0.0, 0.0001]
