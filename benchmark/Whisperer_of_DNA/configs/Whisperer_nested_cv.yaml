seed: 42
model_config: ../training/config/model_config.json

training:
  max_epochs: 100
  patience: 40
  batch_size: 32

hpo:
  method: grid
  direction: maximize
  metric: avg_pearson
  parameters:
    optimizer.learning_rate:
      type: categorical
      choices: [0.00005, 0.0001]
    optimizer.weight_decay:
      type: categorical
      choices: [0.0001, 0.01]
    model.dropout:
      type: categorical
      choices: [0.1, 0.2]
    model.encoder_layers:
      type: categorical
      choices: [4, 6]
