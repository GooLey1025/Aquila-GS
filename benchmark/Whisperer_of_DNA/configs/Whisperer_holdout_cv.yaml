seed: 42
model_config: ../training/config/model_config.json

training:
  max_epochs: 100
  patience: 40
  batch_size: 16

hpo:
  enabled: true
  method: bayesian
  n_trials: 50
  direction: maximize
  metric: avg_pearson
  seed: 42
  parameters:
    optimizer.learning_rate:
      type: log_uniform
      low: 1.0e-5
      high: 3.0e-4
    optimizer.weight_decay:
      type: log_uniform
      low: 1.0e-5
      high: 1.0e-2
    model.dropout:
      type: float
      low: 0.05
      high: 0.3
      step: 0.05
    model.encoder_layers:
      type: categorical
      choices: [4, 6]
