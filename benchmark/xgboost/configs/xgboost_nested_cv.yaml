# XGBoost leakage-safe nested-CV benchmark configuration.

model:
  objective: reg:squarederror
  eval_metric: rmse
  tree_method: hist
  max_depth: 6
  eta: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0

train:
  max_rounds: 1000
  early_stopping_rounds: 40

hpo:
  enabled: true
  method: bayesian
  n_trials: 200
  metric: avg_pearson
  direction: maximize
  seed: 42
  parameters:
    max_depth:
      type: int
      low: 3
      high: 8
    eta:
      type: log_uniform
      low: 0.01
      high: 0.3
    subsample:
      type: float
      low: 0.6
      high: 1.0
      step: 0.1
    colsample_bytree:
      type: float
      low: 0.6
      high: 1.0
      step: 0.1
    min_child_weight:
      type: int
      low: 1
      high: 8
    gamma:
      type: float
      low: 0.0
      high: 0.5
      step: 0.1
    reg_lambda:
      type: log_uniform
      low: 0.1
      high: 10.0
