# CLCNet nested-CV benchmark configuration.

data:
  missing_genotype_value: 3.0

feature_selection:
  enabled: false
  missing_genotype_value: 3.0
  num_boost_round: 100
  num_threads: 1

model:
  shared_dimensions: [4096, 2048, 1024]

train:
  learning_rate: 0.0001
  batch_size: 32
  momentum: 0.9
  contrastive_weight: 1.0
  scheduler_factor: 0.8
  scheduler_patience: 3
  min_learning_rate: 0.000001
  max_epochs: 100
  patience: 40
  min_delta: 0.0001

hpo:
  enabled: true
  method: bayesian
  n_trials: 200
  metric: avg_pearson
  direction: maximize
  seed: 42
  parameters:
    train.learning_rate:
      type: log_uniform
      low: 1.0e-5
      high: 3.0e-3
    train.batch_size:
      type: categorical
      choices: [16, 32]
    train.momentum:
      type: float
      low: 0.85
      high: 0.95
      step: 0.05
    train.contrastive_weight:
      type: float
      low: 0.25
      high: 1.0
      step: 0.25
    train.scheduler_factor:
      type: float
      low: 0.5
      high: 0.9
      step: 0.1
    model.shared_dimensions:
      type: categorical
      choices:
        - [4096, 2048, 1024]
        - [2048, 1024, 512]
